name: Docker Publish
description: Log in to a container registry and build/push a Docker image.
inputs:
  registry:
    description: Container registry hostname (e.g., ghcr.io)
    required: true
  username:
    description: Registry username
    required: true
  password:
    description: Registry password or token
    required: true
  name:
    description: Full image name without tag (e.g., owner/repo)
    required: true
  tags:
    description: Newline-separated list of tags (e.g., dev-00001234 or 1.2.3)
    required: true
  dockerfile:
    description: Path to Dockerfile
    required: false
    default: ./Dockerfile
  push:
    type: boolean
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to registry (${{ inputs.registry }})
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Normalize raw tags for metadata-action
      id: meta_tags
      shell: bash
      run: |
        set -euo pipefail

        {
          echo "value<<EOF"
          printf '%s' "${{ inputs.tags }}" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; /^$/d; s/^/type=raw,value=/'
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Docker metadata (tags/labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.name }}
        tags: ${{ steps.meta_tags.outputs.value }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
